<head>

<title>Benchmark comparison</title>
<style>
  :root { color-scheme: light dark; --page: #f6f7f9; --surface: #fff; --text: #202731;

  @media (prefers-color-scheme: dark) {
    :root { --page: #14191f; --surface: #1c232c; --text: #e5ebf2; --muted: #aebbc9;

      --hover: #293440; --tooltip: #eef3f9; --tip-text: #19212a; }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--page); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 1760px; margin: auto; padding: 30px clamp(16px, 3vw, 48px) 64px; }
  h1 { font-size: 27px; line-height: 1.2; font-weight: 600; overflow-wrap: anywhere; margin: 0 0 12px; }
  h2 { font-size: 17px; font-weight: 600; margin: 0; overflow-wrap: anywhere; }
  h3 { margin: 0 0 5px; font-size: 14px; font-weight: 500; text-align: center; }
  p { margin: 7px 0; }
  .muted, .summary, .hint { color: var(--muted); }
  .summary { margin-bottom: 12px; }
  .table-tools { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin: 22px 0 12px; }
  input { width: min(480px, 100%); padding: 9px 12px; border: 1px solid var(--line);
    border-radius: 5px; background: var(--surface); color: var(--text); font: inherit; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  .table-scroll { overflow: auto; background: var(--surface); border: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  caption { text-align: left; padding: 12px 14px; font-weight: 600; }
  th, td { padding: 10px 14px; text-align: left; border-top: 1px solid var(--line); vertical-align: top; }
  th { background: var(--hover); white-space: nowrap; }
  td:nth-child(n+4) { white-space: nowrap; text-align: right; }
  tbody tr:hover { background: var(--hover); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .sort, .jump { padding: 0; border: 0; background: transparent; text-align: inherit; }
  .sort { font-weight: 600; }
  .sort::after { content: " ↕"; color: var(--muted); }
  th[aria-sort="ascending"] .sort::after { content: " ↑"; }
  th[aria-sort="descending"] .sort::after { content: " ↓"; }
  .jump { overflow-wrap: anywhere; }
  .jump:hover { text-decoration: underline; }
  .benchmark { margin-top: 28px; padding: 18px; border: 1px solid var(--line);
    background: var(--surface); scroll-margin-top: 16px; }
  .benchmark-head { display: flex; gap: 14px; justify-content: space-between; align-items: flex-start; }
  .reset { padding: 5px 10px; border: 1px solid var(--line); border-radius: 4px;
    background: transparent; white-space: nowrap; }
  .legend { display: flex; gap: 10px 22px; flex-wrap: wrap; margin: 12px 0; }
  .legend button { background: transparent; border: 0; padding: 0; text-align: left; }
  .legend button[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
  .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 7px; border-radius: 50%; }
  .figure-grid { display: grid; grid-template-columns: 1fr 1fr 1.55fr; gap: 18px; }
  .panel { min-width: 0; }
  svg { display: block; width: 100%; height: 315px; overflow: visible; touch-action: pan-y; }
  svg text { fill: var(--text); font: 11px system-ui, sans-serif; }
  svg .axis-label { font-size: 12px; }
  svg .grid { stroke: var(--grid); stroke-width: 1; }
  svg .frame { fill: none; stroke: var(--line); stroke-width: 1; }
  .hint, .plot-note { font-size: 12px; }
  .plot-note { min-height: 18px; color: var(--muted); }
  #tooltip { position: fixed; z-index: 5; pointer-events: none; max-width: min(420px, 90vw);
    background: var(--tooltip); color: var(--tip-text); padding: 9px 12px; border-radius: 5px;
    box-shadow: 0 2px 10px #0003; white-space: pre-line; font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }
  @media (max-width: 1200px) { .figure-grid { grid-template-columns: 1fr 1fr; }
    .panel:last-child { grid-column: 1 / -1; } }
  @media (max-width: 660px) { .figure-grid { grid-template-columns: 1fr; }
    .benchmark { padding: 12px; } .benchmark-head { flex-wrap: wrap; }
    th, td { padding: 8px 10px; } }
  @media print { body { background: white; color: black; } .table-tools, .reset, .hint { display: none; }
    .benchmark { break-inside: avoid; } .table-scroll { overflow: visible; } }
</style>

      this.svg.addEventListener("pointerdown", event => {
        const p = this.point(event);
        if (event.button !== 0 || !this.inside(p)) return;
        this.drag = {point: p, x: [...this.x], y: [...this.y]};
        this.svg.setPointerCapture(event.pointerId); hideTip();
      });
      this.svg.addEventListener("pointermove", event => {
        const p = this.point(event);
        if (this.drag) {
          const dx = (p.x - this.drag.point.x) / (this.right - this.left) * (this.drag.x[1] - this.drag.x[0]);
          const dy = (p.y - this.drag.point.y) / (this.bottom - this.top) * (this.drag.y[1] - this.drag.y[0]);
          if (this.type !== "bar") this.x = this.drag.x.map(value => value - dx);
          this.y = this.drag.y.map(value => value + dy); this.render(); return;
        }
        this.hover(p, event);
      });
      const stopDrag = event => {
        this.drag = null;
        if (this.svg.hasPointerCapture(event.pointerId)) this.svg.releasePointerCapture(event.pointerId);
      };
      this.svg.addEventListener("pointerup", stopDrag);
      this.svg.addEventListener("pointercancel", stopDrag);
      this.svg.addEventListener("pointerleave", () => { if (!this.drag) hideTip(); });
      this.svg.addEventListener("dblclick", () => this.reset());
      this.svg.addEventListener("wheel", event => {
        const p = this.point(event);
        if (!event.shiftKey || !this.inside(p)) return;
        event.preventDefault(); hideTip();
        const factor = Math.exp(Math.max(-1, Math.min(1, event.deltaY * .002)));
        const zoom = (domain, center, initial) => {
          const span = (domain[1] - domain[0]) * factor;
          if (span < (initial[1] - initial[0]) * 1e-6 || span > (initial[1] - initial[0]) * 1e6) return domain;
          return domain.map(value => center + (value - center) * factor);
        };
        if (this.type !== "bar") this.x = zoom(this.x, this.unX(p.x), this.initialX);
        this.y = zoom(this.y, this.unY(p.y), this.initialY); this.render();
      }, {passive: false});
      new ResizeObserver(() => this.render()).observe(container);
      this.render();
    }
    reset() { this.x = [...this.initialX]; this.y = [...this.initialY]; this.render(); hideTip(); }
    point(event) {
      const box = this.svg.getBoundingClientRect();
      return {x: (event.clientX - box.left) * this.width / box.width,
              y: (event.clientY - box.top) * this.height / box.height};
    }
    inside(p) { return p.x >= this.left && p.x <= this.right && p.y >= this.top && p.y <= this.bottom; }
    unX(x) { return this.x[0] + (x - this.left) / (this.right - this.left) * (this.x[1] - this.x[0]); }
    unY(y) { return this.y[0] + (this.bottom - y) / (this.bottom - this.top) * (this.y[1] - this.y[0]); }
    line(parent, x1, y1, x2, y2, attrs = {}) {
      return svgNode(parent, "line", {x1, y1, x2, y2, ...attrs});
    }
    render() {
      this.width = this.svg.getBoundingClientRect().width;
      if (this.width < 100) return;
      this.height = 315; this.left = 68; this.top = 28; this.bottom = 263;
      this.right = this.width - (this.type === "scatter" ? 124 : 14);
      this.sx = scale(this.x, this.left, this.right);
      this.sy = scale(this.y, this.bottom, this.top);
      this.svg.setAttribute("viewBox", `0 0 ${this.width} ${this.height}`);
      this.svg.replaceChildren(); this.targets = [];
      svgNode(this.svg, "title", {}, `${this.bench.title}: ${this.type}`);
      const clip = svgNode(svgNode(this.svg, "defs"), "clipPath", {id: this.key});
      svgNode(clip, "rect", {x: this.left, y: this.top, width: this.right - this.left, height: this.bottom - this.top});
      for (const value of ticks(this.y)) {
        const y = this.sy(value);
        this.line(this.svg, this.left, y, this.type === "scatter" ? this.width - 8 : this.right, y, {class: "grid"});
        svgNode(this.svg, "text", {x: this.left - 8, y: y + 4, "text-anchor": "end"}, tickNum(value));
      }
      svgNode(this.svg, "rect", {x: this.left, y: this.top, width: this.right - this.left,
        height: this.bottom - this.top, class: "frame"});
      const xTicks = this.type === "bar" ? [0, 1] : ticks(this.x, this.width < 380 ? 3 : 4);
      for (const value of xTicks) {
        const x = this.sx(value);
        if (x < this.left || x > this.right) continue;
        svgNode(this.svg, "text", {x, y: this.bottom + 20, "text-anchor": "middle"},
          this.type === "bar" ? ["Baseline", "Candidate"][value] : tickNum(value));
      }
      const yLabel = this.type === "density" ? `Density (1 / (${this.bench.unit}))` : `Measurement (${this.bench.unit})`;
      svgNode(this.svg, "text", {transform: `translate(15 ${(this.top + this.bottom) / 2}) rotate(-90)`,
        class: "axis-label", "text-anchor": "middle"}, yLabel);
      const xLabel = this.type === "density" ? `Measurement (${this.bench.unit})` : this.type === "scatter" ? "Measurement index" : "";
      svgNode(this.svg, "text", {x: (this.left + this.right) / 2, y: this.height - 12,
        class: "axis-label", "text-anchor": "middle"}, xLabel);
      const group = svgNode(this.svg, "g", {"clip-path": `url(#${this.key})`});
      this.bench.runs.forEach((run, index) => {
        if (!this.visible[index]) return;
        const color = colors[index];
        if (this.type === "bar") {
          const x = this.sx(index), zero = this.sy(0), y = this.sy(run.score);
          const width = (this.right - this.left) * .24;
          svgNode(group, "rect", {x: x - width / 2, y: Math.min(zero, y), width,
            height: Math.abs(zero - y), fill: color});
          if (run.ci) {
            const low = this.sy(run.ci[0]), high = this.sy(run.ci[1]);
            this.line(group, x, low, x, high, {stroke: "var(--text)", "stroke-width": 1.5});
            for (const cy of [low, high]) this.line(group, x - 7, cy, x + 7, cy, {stroke: "var(--text)", "stroke-width": 1.5});
          }
          svgNode(group, "text", {x: x + 9, y: y - 5}, num(run.score));
        } else if (this.type === "density") {
          if (run.density) {
            const points = this.bench.densityX.map((x, i) => `${this.sx(x)},${this.sy(run.density[i])}`);
            svgNode(group, "path", {d: `M${this.sx(this.bench.densityX[0])},${this.sy(0)}L${points.join("L")}L${this.sx(this.bench.densityX.at(-1))},${this.sy(0)}Z`,
              fill: color, "fill-opacity": .12, stroke: "none"});
            svgNode(group, "path", {d: `M${points.join("L")}`, fill: "none", stroke: color, "stroke-width": 2});
          } else if (run.samples.length) {
            this.line(group, this.sx(run.score), this.top, this.sx(run.score), this.bottom,
              {stroke: color, "stroke-width": 2, "stroke-dasharray": "4 4"});
          }
        } else {
          run.samples.forEach((value, sample) => {
            const x = this.sx(sample + 1), y = this.sy(value);
            svgNode(group, "circle", {cx: x, cy: y, r: 3.2, fill: color, opacity: .75});
            this.targets.push({x, y, index, sample, value});
          });
        }
      });
      if (this.type === "scatter") this.drawStrips();
      this.svg.style.cursor = this.drag ? "grabbing" : "crosshair";
    }
    drawStrips() {
      const clip = svgNode(this.svg.querySelector("defs"), "clipPath", {id: `${this.key}-strips`});
      svgNode(clip, "rect", {x: this.right + 4, y: this.top, width: this.width - this.right - 4, height: this.bottom - this.top});
      const group = svgNode(this.svg, "g", {"clip-path": `url(#${this.key}-strips)`});
      this.bench.runs.forEach((run, index) => {
        const x = this.width - 88 + index * 59;
        svgNode(this.svg, "text", {x, y: 15, "text-anchor": "middle"}, ["Baseline", "Candidate"][index]);
        this.line(group, x, this.top, x, this.bottom, {stroke: "var(--line)"});
        if (!this.visible[index]) return;
        run.samples.forEach((value, sample) => {
          const y = this.sy(value);
          svgNode(group, "circle", {cx: x, cy: y, r: 3.2, fill: colors[index], opacity: .75});
          this.targets.push({x, y, index, sample, value});
        });
      });
    }
    hover(p, event) {
      const withinY = p.y >= this.top && p.y <= this.bottom;
      if (!withinY || p.x < this.left || p.x > this.width - 8) { hideTip(); return; }
      if (this.type === "bar") {
        const index = Math.max(0, Math.min(1, Math.round(this.unX(p.x))));
        if (!this.visible[index]) { hideTip(); return; }
        const run = this.bench.runs[index];
        showTip(`${data.labels[index]}\nScore: ${num(run.score)} ${this.bench.unit}\nCI: ${run.ci ? run.ci.map(num).join(" to ") : "unavailable"}\nMeasurements: ${run.samples.length}`, event);
      } else if (this.type === "density" && this.inside(p)) {
        const x = this.unX(p.x), grid = this.bench.densityX;
        let text = `Measurement: ${num(x)} ${this.bench.unit}`;
        this.bench.runs.forEach((run, index) => {
          if (!this.visible[index]) return;
          let value = run.densityNote;
          if (run.density && grid.length) {
            const position = (x - grid[0]) / (grid.at(-1) - grid[0]) * (grid.length - 1);
            if (position < 0 || position > grid.length - 1) value = "outside KDE range";
            else {
              const i = Math.min(grid.length - 2, Math.floor(position)), fraction = position - i;
              value = `density ${num(run.density[i] * (1 - fraction) + run.density[i + 1] * fraction)}`;
            }
          }
          text += `\n${data.labels[index]}: ${value}`;
        });
        showTip(text, event);
      } else if (this.type === "scatter") {
        let best = null, distance = Infinity;
        for (const target of this.targets) {
          if (target.y < this.top || target.y > this.bottom) continue;
          if (target.x < this.left || target.x > this.width - 8) continue;
          const d = (p.x - target.x) ** 2 + (p.y - target.y) ** 2;
          if (d < distance) { distance = d; best = target; }
        }
        if (!best || distance > 35 ** 2) { hideTip(); return; }
        showTip(`${data.labels[best.index]}\nMeasurement ${best.sample + 1}: ${num(best.value)} ${this.bench.unit}`, event);
      } else hideTip();
    }
  }

  const entries = data.benchmarks.map((bench, index) => {
    const section = el("section", undefined, "benchmark"); section.id = `benchmark-${index}`;
    const heading = el("div", undefined, "benchmark-head");
    heading.append(el("h2", bench.title));
    const reset = el("button", "Reset zoom", "reset"); reset.type = "button"; heading.append(reset);
    section.append(heading);
    const legend = el("div", undefined, "legend"), visible = [true, true], charts = [];
    bench.runs.forEach((run, i) => {
      const button = el("button"); button.type = "button"; button.setAttribute("aria-pressed", "true");
      const swatch = el("span", undefined, "swatch"); swatch.style.background = colors[i];
      button.append(swatch, document.createTextNode(`${data.labels[i]} (n=${run.samples.length})`));
      button.addEventListener("click", () => {
        visible[i] = !visible[i]; button.setAttribute("aria-pressed", String(visible[i]));
        hideTip(); charts.forEach(chart => chart.render());
      });
      legend.append(button);
    });
    section.append(legend);
    const figure = el("div", undefined, "figure-grid"); section.append(figure);
    byId("benchmarks").append(section);
    [["bar", "Score and confidence interval"], ["density", "Gaussian kernel density estimates"],
      ["scatter", "Individual measurements and projections"]].forEach(([type, title]) => {
      const panel = el("div", undefined, "panel"); panel.append(el("h3", title)); figure.append(panel);
      charts.push(new Chart(panel, bench, type, visible, `clip-${index}-${type}`));
      const notes = type === "density" ? bench.runs.map((run, i) => run.densityNote ? `${["Baseline", "Candidate"][i]}: ${run.densityNote}` : "").filter(Boolean) :
        type === "scatter" ? bench.runs.map((run, i) => run.samples.length ? "" : `${["Baseline", "Candidate"][i]}: no raw measurements`).filter(Boolean) : [];
      panel.append(el("div", notes.join(" · "), "plot-note"));
    });
    reset.addEventListener("click", () => charts.forEach(chart => chart.reset()));
    const row = el("tr");
    const nameCell = el("td"), jump = el("button", bench.name, "jump"); jump.type = "button";
    jump.title = `View plots for ${bench.title}`;
    jump.addEventListener("click", () => section.scrollIntoView({behavior: "smooth", block: "start"}));
    nameCell.append(jump); row.append(nameCell);
    [bench.params, bench.unit, ...bench.runs.map(run => run.cell), relativeSpeed(bench.speedup)]
      .forEach(value => row.append(el("td", value)));
    byId("rows").append(row);
    return {bench, row, section, search: `${bench.fullName} ${bench.title} ${bench.params}`.toLowerCase()};
  });
  let ordered = [...entries], sortKey = -1, descending = false;
  const headers = ["Benchmark", "Parameters", "Unit", data.labels[0], data.labels[1], "Relative speedup"];
  function sortValue(entry, column) {
    const bench = entry.bench;
    if (column === 0) return bench.name;
    if (column === 1) return bench.params;
    if (column === 2) return bench.unit;
    if (column === 5) return bench.speedup;
    return bench.runs[column - 3].score * bench.unitScale;
  }
  headers.forEach((name, column) => {
    const th = el("th"); th.scope = "col"; th.setAttribute("aria-sort", "none");
    const button = el("button", name, "sort"); button.type = "button";
    button.addEventListener("click", () => {
      descending = sortKey === column ? !descending : false; sortKey = column;
      ordered.sort((a, b) => {
        const first = sortValue(a, column), second = sortValue(b, column);
        if (first === null || second === null) return first === second ? 0 : first === null ? 1 : -1;
        const result = typeof first === "number" ? first - second : collator.compare(first, second);
        return descending ? -result : result;
      });
      byId("columns").querySelectorAll("th").forEach(node => node.setAttribute("aria-sort", "none"));
      th.setAttribute("aria-sort", descending ? "descending" : "ascending");
      ordered.forEach(entry => { byId("rows").append(entry.row); byId("benchmarks").append(entry.section); });
    });
    th.append(button); byId("columns").append(th);
  });
  function filter() {
    const query = byId("search").value.trim().toLowerCase(); let count = 0;
    entries.forEach(entry => {
      const match = entry.search.includes(query); entry.row.hidden = entry.section.hidden = !match;
      if (match) count++;
    });
    byId("count").textContent = `${count} of ${entries.length} benchmarks`;
    hideTip();
  }
  byId("search").addEventListener("input", filter); filter();
})();
</script>
</body>
</html>
